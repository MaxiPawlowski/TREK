# Imagen propia para tenazas: construye la rama `tenazas` del fork y la publica en GHCR.
# tenazas no puede compilar TREK (3.3 GB de RAM; el build del server pide 4 GB de heap),
# así que el server solo baja la imagen ya armada.
name: tenazas image

on:
  push:
    branches: [tenazas]
    paths:
      - 'client/**'
      - 'server/**'
      - 'shared/**'
      - 'wiki/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/tenazas-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: tenazas-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Version
        id: v
        run: |
          base=$(node -p "require('./package.json').version")
          short=$(git rev-parse --short=7 HEAD)
          echo "version=${base}-tenazas.${short}" >> "$GITHUB_OUTPUT"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/maxipawlowski/trek:tenazas
            ghcr.io/maxipawlowski/trek:tenazas-${{ steps.v.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/MaxiPawlowski/TREK
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
